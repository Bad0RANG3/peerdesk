<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="stage">
  <canvas id="screen" tabindex="0"></canvas>

  <div class="gate" id="gate">
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">远程协助</div>
          <div class="card-sub">输入对端 9 位连接码，或等待对方发起</div>
        </div>
        <span class="pill">PDTP/1</span>
      </div>

      <div class="field">
        <label for="code">连接码</label>
        <input id="code" class="input" inputmode="numeric" maxlength="11" placeholder="000 000 000" autocomplete="off" spellcheck="false" />
      </div>

      <div class="field">
        <label for="server">信令服务器</label>
        <input id="server" class="input" style="letter-spacing:0;font-family:var(--font)" placeholder="127.0.0.1:7900" />
      </div>

      <button class="btn primary block" id="connect">连接</button>

      <div class="status" id="gateStatus">
        <span class="dot" id="gateDot"></span>
        <span id="gateText">未连接</span>
      </div>
    </div>
  </div>

  <div class="toolbar pin" id="toolbar" style="display:none">
    <button class="tool" data-menu="display" title="显示器">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span id="monLabel">显示器</span>
    </button>
    <button class="tool" data-menu="quality" title="画质">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.4"/></svg>
      <span id="qLabel">均衡</span>
    </button>
    <div class="sep"></div>
    <button class="tool" id="btnClip" title="同步剪贴板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="3.5" width="12" height="15" rx="2"/><path d="M16 21H6a2 2 0 0 1-2-2V7"/><path d="M11 8h6M11 12h6"/></svg>
      <span>剪贴板</span>
    </button>
    <button class="tool" id="btnKeys" title="键盘输入">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 14h.01M9 14h6M18 14h.01"/></svg>
      <span>键盘</span>
    </button>
    <button class="tool" id="btnFile" title="发送文件到对端">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
      <span>文件</span>
    </button>
    <button class="tool" id="btnCtrlAltDel" title="发送 Ctrl+Alt+Del">CAD</button>
    <button class="tool active" id="btnAudio" title="对端声音（µ-law 16 kHz）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z"/><path d="M16 9.2a4 4 0 0 1 0 5.6M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
      <span>声音</span>
    </button>
    <div class="sep"></div>
    <button class="tool" id="btnFull" title="全屏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span>全屏</span>
    </button>
    <button class="tool" id="btnHud" title="显示/隐藏状态">HUD</button>
    <div class="sep"></div>
    <button class="tool danger" id="btnHangup" title="断开">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 6.5c5-3 12-3 17 0v3l-4 1.5-2-2.5c-2-.3-4-.3-6 0l-2 2.5-4-1.5z"/></svg>
      <span>断开</span>
    </button>
  </div>

  <div class="menu" id="menu"></div>

  <div class="hud" id="hud" style="display:none">
    <div><span class="k">链路</span> <b id="hudMode">—</b></div>
    <div><span class="k">分辨率</span> <b id="hudRes">—</b></div>
    <div><span class="k">帧率</span> <b id="hudFps">—</b></div>
    <div><span class="k">码率</span> <b id="hudMbps">—</b></div>
    <div><span class="k">延迟</span> <b id="hudRtt">—</b></div>
    <div><span class="k">声音</span> <b id="hudAud">—</b></div>
  </div>

  <div class="kbd-capture" id="kbdBox">
    <div class="kbd-box">
      <div class="card-title" style="margin-bottom:10px">发送文本到远程</div>
      <textarea id="kbdText" placeholder="输入任意文字（支持中文/表情），点击发送后会键入对端当前焦点窗口。"></textarea>
      <div class="row">
        <button class="btn small" id="kbdCancel">取消</button>
        <button class="btn small primary" id="kbdSend">发送</button>
      </div>
    </div>
  </div>

  <div class="drop" id="drop">
    <div class="drop-inner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
      <div>松开鼠标，把文件发送到对端</div>
    </div>
  </div>

  <input type="file" id="filePick" multiple style="display:none" />

  <div class="toast" id="toast"></div>
</div>
<script src="/viewer.js"></script>
</body>
</html>
