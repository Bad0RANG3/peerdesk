name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff

      - name: Import smoke test
        run: |
          python -c "import peerdesk, peerdesk.wire, peerdesk.crypto, peerdesk.transport, peerdesk.session, peerdesk.server, peerdesk.webui, peerdesk.agent, peerdesk.viewer, peerdesk.doctor; print(peerdesk.__version__)"

      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check peerdesk tests

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Local end-to-end (direct + relay)
        # 需要可用的桌面会话：Windows runner 有交互式桌面，但抓屏在服务会话里可能失败。
        # 失败不阻塞合并，单独标记，方便对比"代码问题"与"环境问题"。
        continue-on-error: true
        run: |
          python tests/e2e_local.py
          python tests/e2e_local.py --relay

  build-exe:
    name: 打包单文件 exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build
        run: python packaging/build.py

      - name: Smoke test
        run: |
          dist\peerdesk.exe --help
          dist\peerdesk.exe doctor

      - name: End-to-end (exe, 三进程)
        # 抓屏依赖交互式桌面；托管 runner 是服务会话，抓不到画面就跳过，不阻塞。
        continue-on-error: true
        run: python tests/e2e_exe.py --seconds 10

      - uses: actions/upload-artifact@v4
        with:
          name: peerdesk-exe
          path: dist/peerdesk.exe
          if-no-files-found: error
