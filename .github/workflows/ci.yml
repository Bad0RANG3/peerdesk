name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff

      - name: Import smoke test
        run: |
          python -c "import peerdesk, peerdesk.wire, peerdesk.crypto, peerdesk.transport, peerdesk.session, peerdesk.server, peerdesk.webui, peerdesk.agent, peerdesk.viewer, peerdesk.doctor; print(peerdesk.__version__)"

      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check peerdesk tests

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Local end-to-end (direct + relay)
        # 需要可用的桌面会话：Windows runner 有交互式桌面，但抓屏在服务会话里可能失败。
        # 失败不阻塞合并，单独标记，方便对比"代码问题"与"环境问题"。
        continue-on-error: true
        run: |
          python tests/e2e_local.py
          python tests/e2e_local.py --relay
