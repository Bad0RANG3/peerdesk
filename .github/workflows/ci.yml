name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows / Qt 6.8 / MinGW
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          modules: "qtmultimedia"
          tools: "tools_mingw1310"
          cache: true

      - name: Verify toolchain
        shell: pwsh
        run: |
          $compiler = Join-Path $env:IQTA_TOOLS "mingw1310_64\bin\g++.exe"
          if (-not (Test-Path $compiler)) {
            Get-ChildItem $env:IQTA_TOOLS
            throw "MinGW compiler not found at $compiler"
          }
          Get-Command cmake, ninja, g++ | Format-Table Name, Source
          cmake --version
          ninja --version
          & $compiler --version

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-mingw-ci

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-mingw-ci

      - name: Test
        shell: pwsh
        run: ctest --preset windows-mingw-ci --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: build/cpp/Testing
          if-no-files-found: ignore
