[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peerdesk"
version = "0.5.0"
description = "PeerDesk 对端桌面 — 自研 PDTP/1 协议的 P2P 远程桌面（Windows，纯 Python）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bad0RANG3" }]
keywords = ["remote-desktop", "p2p", "webrtc-free", "screen-sharing", "windows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "Pillow>=10",
  "numpy>=1.26",
  "cryptography>=42",
  "mss>=9",
]

[project.optional-dependencies]
dev = ["build>=1.0", "ruff>=0.5"]

[project.scripts]
peerdesk = "peerdesk.__main__:main"

[project.urls]
Homepage = "https://github.com/Bad0RANG3/peerdesk"
Issues = "https://github.com/Bad0RANG3/peerdesk/issues"

[tool.setuptools]
packages = ["peerdesk"]

[tool.setuptools.package-data]
peerdesk = ["web/*.html", "web/*.js", "web/*.css"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
